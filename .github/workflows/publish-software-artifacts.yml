name: Publish software artifacts

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package ID or all
        type: choice
        options: [all, vcredist, powershell7, adobereader, chrome, edge]
        default: all
        required: true
  workflow_call:
    inputs:
      package:
        description: Package ID or all
        type: string
        default: all
        required: false

permissions:
  contents: read

concurrency:
  group: software-publication
  cancel-in-progress: false

jobs:
  validate-publish:
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r scripts/requirements.txt
      - name: Resolve and download vendor installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ID: ${{ inputs.package }}
        run: python scripts/resolve.py --package $env:PACKAGE_ID
      - name: Validate hashes, signatures and embedded versions
        shell: pwsh
        run: ./scripts/validate-artifacts.ps1
      - name: Retain validation metadata
        uses: actions/upload-artifact@v4
        with:
          name: software-validation-${{ github.run_id }}
          retention-days: 30
          path: |
            artifacts/*-catalog.json
            artifacts/*.candidate.json
          if-no-files-found: error
      - name: Publish immutable release records and approved installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-artifacts.ps1
