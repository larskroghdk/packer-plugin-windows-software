name: Publish software artifacts

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: Package ID or all
        type: choice
        options: [all, vcredist, powershell7, adobereader, chrome, edge]
        default: all
        required: true

permissions:
  contents: read

concurrency:
  group: software-publication
  cancel-in-progress: false

jobs:
  validate-publish:
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Resolve and download vendor installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ID: ${{ inputs.package || 'all' }}
        run: go run ./cmd/resolve-installers -package $env:PACKAGE_ID
      - name: Validate hashes, signatures and embedded versions
        shell: pwsh
        run: ./scripts/validate-artifacts.ps1
      - name: Retain validation metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: software-validation-${{ github.run_id }}
          retention-days: 30
          path: |
            artifacts/*-catalog.json
            artifacts/*.candidate.json
          if-no-files-found: error
      - name: Publish immutable release records and approved installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-artifacts.ps1
