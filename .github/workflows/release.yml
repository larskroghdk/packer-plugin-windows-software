name: Release plugin

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Format, modules, test, vet and build
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Determine Packer plugin API version
        run: echo "API_VERSION=$(./bin/packer-plugin-windows-software describe | jq -r '.api_version')" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.8.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
